<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialisation du mot de passe — Calculator</title>
<style>
  :root {
    --green: #00833b;
    --green-light: #16a05a;
    --red: #ff1f2d;
    --white: #f7f7f7;
    --muted: #9b9b9b;
    --panel: rgba(16, 16, 16, .78);
    --border: rgba(255,255,255,.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--white);
    background: #050505;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    position: relative;
    display: grid;
    grid-template-columns: 1.15fr .85fr;
  }

  .background {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0,0,0,.98) 0%, rgba(0,0,0,.88) 42%, rgba(0,0,0,.55) 100%),
      linear-gradient(0deg, rgba(0,0,0,.38), rgba(0,0,0,.25)),
      url("background.png") center / cover no-repeat;
    filter: saturate(.8);
  }

  .red-glow {
    position: absolute;
    width: 520px;
    height: 520px;
    right: -180px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 20, 35, .16);
    filter: blur(110px);
    border-radius: 50%;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    padding: 42px 6vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand {
    position: absolute;
    top: 38px;
    left: 6vw;
  }

  .brand img {
    width: 260px;
    max-width: 48vw;
    height: auto;
    display: block;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 18px;
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .eyebrow::after {
    content: "";
    width: 46px;
    height: 2px;
    background: var(--red);
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(34px, 4vw, 56px);
    line-height: .98;
    letter-spacing: -.035em;
    font-weight: 700;
  }

  .intro {
    max-width: 570px;
    margin: 0 0 30px;
    color: #c3c3c3;
    font-size: 15px;
    line-height: 1.65;
  }

  .card {
    width: min(560px, 100%);
    padding: 30px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: #ddd;
    font-size: 13px;
    font-weight: 600;
  }

  .input-wrap { position: relative; }

  input {
    width: 100%;
    height: 52px;
    padding: 0 48px 0 16px;
    border: 1px solid #3a3a3a;
    border-radius: 9px;
    outline: none;
    color: #fff;
    background: rgba(255,255,255,.055);
    font-size: 15px;
    transition: .2s ease;
  }

  input::placeholder { color: #737373; }

  input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(0,131,59,.14);
    background: rgba(255,255,255,.075);
  }

  .toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: none;
    color: #888;
    cursor: pointer;
    font-size: 12px;
    padding: 6px;
  }

  .toggle:hover { color: #fff; }

  .requirements {
    margin: 5px 0 23px;
    padding: 14px 16px;
    border-radius: 9px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
  }

  .requirements-title {
    margin-bottom: 9px;
    color: #aaa;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .reqs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 14px;
  }

  .req {
    color: #777;
    font-size: 12px;
    transition: color .2s;
  }

  .req.ok { color: #54c987; }

  .req::before {
    content: "○";
    display: inline-block;
    width: 18px;
    color: #666;
  }

  .req.ok::before {
    content: "✓";
    color: #54c987;
  }

  .submit {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 9px;
    background: var(--green);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: .2s ease;
  }

  .submit:hover {
    background: var(--green-light);
    transform: translateY(-1px);
    box-shadow: 0 10px 28px rgba(0,131,59,.25);
  }

  .submit:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .message {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.45;
  }

  .message.error {
    display: block;
    color: #ff8d95;
    background: rgba(255,31,45,.09);
    border: 1px solid rgba(255,31,45,.2);
  }

  .message.success {
    display: block;
    color: #76d9a1;
    background: rgba(0,131,59,.10);
    border: 1px solid rgba(0,131,59,.22);
  }

  .footer {
    position: absolute;
    left: 6vw;
    bottom: 30px;
    color: #666;
    font-size: 11px;
  }

  .footer span { color: #8a8a8a; }

  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; }
    .background {
      background:
        linear-gradient(90deg, rgba(0,0,0,.94), rgba(0,0,0,.82)),
        url("background.png") center / cover no-repeat;
    }
    .content { padding: 120px 24px 80px; }
    .brand { left: 24px; top: 28px; }
    .footer { left: 24px; }
    .card { padding: 24px; }
  }

  @media (max-width: 480px) {
    .reqs { grid-template-columns: 1fr; }
    h1 { font-size: 38px; }
  }
</style>
</head>

<body>
  <main class="page">
    <div class="background"></div>
    <div class="red-glow"></div>

    <section class="content">
      <div class="brand">
        <img src="logo.png" alt="Chalvignac Industries">
      </div>

      <div>
        <div class="eyebrow">Calculator</div>
        <h1>Réinitialiser<br>le mot de passe</h1>
        <p class="intro">
          Définissez un nouveau mot de passe pour sécuriser votre accès à
          l'application Calculator.
        </p>

        <form class="card" id="resetForm">
          <div class="field">
            <label for="password">Nouveau mot de passe</label>
            <div class="input-wrap">
              <input id="password" type="password" autocomplete="new-password"
                     placeholder="Saisissez votre nouveau mot de passe">
              <button class="toggle" type="button" data-target="password">Afficher</button>
            </div>
          </div>

          <div class="field">
            <label for="confirm">Confirmer le mot de passe</label>
            <div class="input-wrap">
              <input id="confirm" type="password" autocomplete="new-password"
                     placeholder="Confirmez votre nouveau mot de passe">
              <button class="toggle" type="button" data-target="confirm">Afficher</button>
            </div>
          </div>

          <div class="requirements">
            <div class="requirements-title">Exigences de sécurité</div>
            <div class="reqs">
              <div class="req" id="length">8 caractères minimum</div>
              <div class="req" id="upper">Une majuscule</div>
              <div class="req" id="number">Un chiffre</div>
              <div class="req" id="match">Les mots de passe correspondent</div>
            </div>
          </div>

          <button class="submit" id="submit" type="submit" disabled>
            Réinitialiser le mot de passe
          </button>

          <div class="message" id="message"></div>
        </form>
      </div>

      <div class="footer">Groupe Chalvignac · <span>Calculator</span></div>
    </section>
  </main>

<script>
  // --- À renseigner : Project Settings → API dans le tableau de bord Supabase ---
const SUPABASE_URL = "https://saronfglrwvhodzdsjmo.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhcm9uZmdscnd2aG9kemRzam1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDY1NzAsImV4cCI6MjEwNDUyMjU3MH0.H-vfhCr_CMsqraGbYu8Gbu3zUr9-VDc_JsPBc0SdKWs";

  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirm");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");

  /* Le jeton et l'adresse arrivent en paramètres de requête (?email=...&token=...),
     déposés par le modèle d'email personnalisé — voir la note en bas de fichier.
     Volontairement, on ne les échange PAS ici : le simple chargement de la page ne
     doit consommer aucun jeton. C'est le seul moyen fiable d'empêcher un scanner de
     sécurité (Safe Links, antivirus de messagerie…) de griller le lien avant que
     l'utilisateur ne clique dessus pour de vrai — voir la documentation Supabase sur
     le « prefetching » des liens d'email. L'échange n'a lieu qu'à la soumission du
     formulaire, donc uniquement sur une vraie interaction humaine. */
  const params = new URLSearchParams(location.search);
  const email = params.get("email");
  const recoveryToken = params.get("token");

  if (!email || !recoveryToken) {
    message.className = "message error";
    message.textContent = "Lien invalide ou expiré. Demandez un nouveau mail de réinitialisation.";
    password.disabled = true;
    confirmPassword.disabled = true;
  }

  const rules = {
    length: value => value.length >= 8,
    upper: value => /[A-ZÀ-Ý]/.test(value),
    number: value => /\d/.test(value),
    match: () => password.value !== "" && password.value === confirmPassword.value
  };

  function updateRules() {
    Object.entries(rules).forEach(([id, test]) => {
      document.getElementById(id).classList.toggle("ok", test(password.value));
    });
    submit.disabled = !Object.values(rules).every(test => test(password.value)) || !email || !recoveryToken;
  }

  password.addEventListener("input", updateRules);
  confirmPassword.addEventListener("input", updateRules);

  document.querySelectorAll(".toggle").forEach(button => {
    button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.target);
      const visible = input.type === "text";
      input.type = visible ? "password" : "text";
      button.textContent = visible ? "Afficher" : "Masquer";
    });
  });

  document.getElementById("resetForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (password.value !== confirmPassword.value) {
      message.className = "message error";
      message.textContent = "Les deux mots de passe ne correspondent pas.";
      return;
    }

    submit.disabled = true;
    submit.textContent = "Vérification…";
    message.className = "message";
    message.textContent = "";

    try {
      /* Étape 1 — on échange le jeton contre une vraie session, seulement
         maintenant : c'est ce seul appel qui consomme le jeton à usage unique.
         Équivalent REST de supabase.auth.verifyOtp({ email, token, type:'recovery' }). */
      const rv = await fetch(SUPABASE_URL + "/auth/v1/verify", {
        method: "POST",
        headers: { "apikey": ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ type: "recovery", email: email, token: recoveryToken }),
      });
      const session = await rv.json().catch(() => ({}));

      if (!rv.ok || !session.access_token) {
        message.className = "message error";
        message.textContent = "Lien invalide ou expiré : " +
          (session.msg || session.error_description || session.message || ("erreur " + rv.status)) +
          " Demandez un nouveau mail de réinitialisation.";
        submit.disabled = false;
        submit.textContent = "Réinitialiser le mot de passe";
        return;
      }

      /* Étape 2 — le jeton est validé, on peut enregistrer le mot de passe. */
      submit.textContent = "Enregistrement…";
      const r = await fetch(SUPABASE_URL + "/auth/v1/user", {
        method: "PUT",
        headers: {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + session.access_token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ password: password.value }),
      });

      if (r.ok) {
        message.className = "message success";
        message.textContent = "Mot de passe modifié. Vous pouvez fermer cette page et vous connecter à Calculator.";
        password.disabled = true;
        confirmPassword.disabled = true;
        submit.textContent = "Mot de passe modifié";
      } else {
        const d = await r.json().catch(() => ({}));
        message.className = "message error";
        message.textContent = "Échec : " + (d.msg || d.error_description || d.message || ("erreur " + r.status));
        submit.disabled = false;
        submit.textContent = "Réinitialiser le mot de passe";
      }
    } catch (err) {
      message.className = "message error";
      message.textContent = "Connexion impossible : " + (err.message || err);
      submit.disabled = false;
      submit.textContent = "Réinitialiser le mot de passe";
    }
  });
</script>
</body>
</html>
